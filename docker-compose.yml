version: "3.8"

# DECARS  
#
#  Services:
#   zookeeper          Kafka coordination
#   kafka              Real Apache Kafka broker
#   kafka-ui           Browser UI for Kafka topics
#   namenode           HDFS NameNode
#   datanode-1/2/3     HDFS DataNodes  (3-node cluster)
#   spark-master       Spark Master node
#   spark-worker-1/2   Two Spark Workers (4 cores, 4 GB each)
#   redis              Recommendation cache (TTL 60s)
#   backend            FastAPI — trains ALS & serves recs
#   kafka-producer     Simulates live clickstream events
#   frontend           React dashboard (Vite dev server)

networks:
  decars-net:
    driver: bridge

volumes:
  hadoop_namenode:
  hadoop_datanode1:
  hadoop_datanode2:
  hadoop_datanode3:
  redis_data:

services:

  # ── Zookeeper 
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    hostname: zookeeper
    container_name: zookeeper
    networks: [decars-net]
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD", "bash", "-c", "echo ruok | nc localhost 2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Kafka Broker 
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    hostname: kafka
    container_name: kafka
    networks: [decars-net]
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"   # external access
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "kafka:29092", "--list"]
      interval: 15s
      timeout: 10s
      retries: 10

  # ── Kafka UI 
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    networks: [decars-net]
    depends_on: [kafka]
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: decars-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

  # ── HDFS NameNode 
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: namenode
    hostname: namenode
    networks: [decars-net]
    ports:
      - "9870:9870"   # HDFS Web UI
      - "9000:9000"   # HDFS RPC
    volumes:
      - hadoop_namenode:/hadoop/dfs/name
      - ./hadoop-config:/etc/hadoop/conf
    environment:
      - CLUSTER_NAME=decars
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
      - CORE_CONF_hadoop_http_staticuser_user=root
      - HDFS_CONF_dfs_replication=3
      - HDFS_CONF_dfs_namenode_datanode_registration_ip___hostname___check=false
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9870"]
      interval: 15s
      timeout: 10s
      retries: 10

  # ── HDFS DataNode 1 
  datanode1:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: datanode1
    networks: [decars-net]
    depends_on:
      namenode:
        condition: service_healthy
    volumes:
      - hadoop_datanode1:/hadoop/dfs/data
    environment:
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
      - HDFS_CONF_dfs_replication=3

  # ── HDFS DataNode 2 
  datanode2:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: datanode2
    networks: [decars-net]
    depends_on:
      namenode:
        condition: service_healthy
    volumes:
      - hadoop_datanode2:/hadoop/dfs/data
    environment:
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
      - HDFS_CONF_dfs_replication=3

  # ── HDFS DataNode 3 
  datanode3:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: datanode3
    networks: [decars-net]
    depends_on:
      namenode:
        condition: service_healthy
    volumes:
      - hadoop_datanode3:/hadoop/dfs/data
    environment:
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
      - HDFS_CONF_dfs_replication=3

  # ── Spark Master
  spark-master:
    image: apache/spark:3.5.3
    container_name: spark-master
    hostname: spark-master
    networks: [decars-net]
    user: root
    ports:
      - "8082:8080"   # Spark Web UI
      - "7077:7077"   # Spark master port
    environment:
      - SPARK_NO_DAEMONIZE=true
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]

  # ── Spark Worker 1
  spark-worker-1:
    image: apache/spark:3.5.3
    container_name: spark-worker-1
    networks: [decars-net]
    user: root
    depends_on: [spark-master]
    environment:
      - SPARK_NO_DAEMONIZE=true
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]

  # ── Spark Worker 2 
  spark-worker-2:
    image: apache/spark:3.5.3
    container_name: spark-worker-2
    networks: [decars-net]
    user: root
    depends_on: [spark-master]
    environment:
      - SPARK_NO_DAEMONIZE=true
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]

  # ── Redis 
  redis:
    image: redis:7-alpine
    container_name: redis
    networks: [decars-net]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  # ── Kafka Producer (clickstream generator) 
  kafka-producer:
    build:
      context: ./kafka_producer
      dockerfile: Dockerfile
    container_name: kafka-producer
    networks: [decars-net]
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC: clickstream
      EVENT_RATE_MS: 500

  # ── Backend API 
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    networks: [decars-net]
    depends_on:
      - namenode
      - kafka
      - redis
      - spark-master
    ports:
      - "8000:8000"
    environment:
      HDFS_URL: hdfs://namenode:9000
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      REDIS_URL: redis://redis:6379
      SPARK_MASTER: spark://spark-master:7077
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
    volumes:
      - ./spark_jobs:/app/spark_jobs

  # ── Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    networks: [decars-net]
    depends_on: [backend]
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: http://localhost:8000
